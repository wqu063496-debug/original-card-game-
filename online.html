<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オンライン対戦ロビー（試作）</title><style>body{font-family:system-ui,sans-serif;background:#10182b;color:#fff;margin:0;padding:25px}main{max-width:680px;margin:auto}.panel{background:#1e2d47;border-radius:16px;padding:22px;margin:18px 0}button,input{font:inherit;padding:12px;border-radius:9px;border:0;margin:5px}button{background:#e5b95a;color:#18233a;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}input{width:150px}.muted{color:#aebcd1}#log{white-space:pre-wrap;line-height:1.8}.warn{background:#483c25;padding:12px;border-radius:8px}</style></head><body><main><h1>⚔ オンライン対戦ロビー</h1><p class="warn">試作版：部屋の作成・参加・準備完了の同期を確認できます。実際のカード対戦はまだオンライン同期されません。友達以外にルームコードを共有しないでください。</p><div class="panel"><p id="auth">Firebaseに接続中…</p><button id="create" disabled>部屋を作る</button><input id="code" maxlength="6" placeholder="6桁のコード" inputmode="numeric"><button id="join" disabled>部屋に参加</button></div><div class="panel"><h2 id="roomTitle">未参加</h2><div id="log">部屋を作成するか参加してください。</div><button id="ready" disabled>準備完了</button><button id="leave" disabled>退出</button></div><p><a style="color:#f4d17c" href="index.html">← BOT対戦・デッキ編集へ戻る</a></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,serverTimestamp,runTransaction} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyCRdX-k7sbaBE1k8MRezsf3htk1BOrURDg',authDomain:'original-card-game.firebaseapp.com',projectId:'original-card-game',storageBucket:'original-card-game.firebasestorage.app',messagingSenderId:'374012324530',appId:'1:374012324530:web:b30cb0cc4f4406dc7ef7ab'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let uid=null,room=null,unsub=null,side=null,current=null;
const $=id=>document.getElementById(id);const status=s=>$('auth').textContent=s;const report=e=>{console.error(e);alert('エラー：'+e.message)};
onAuthStateChanged(auth,user=>{if(user){uid=user.uid;status('接続済み（匿名ログイン）');$('create').disabled=false;$('join').disabled=false}});signInAnonymously(auth).catch(report);
function watch(code){unsub?.();room=code;$('roomTitle').textContent='ルームコード：'+code;$('ready').disabled=false;$('leave').disabled=false;unsub=onSnapshot(doc(db,'rooms',code),snap=>{if(!snap.exists()){status('部屋が削除されました');return}current=snap.data();side=current.host===uid?'host':current.guest===uid?'guest':null;const names=['ホスト','ゲスト'];$('log').textContent=`ホスト：${current.host?'参加済み':'不在'} ${current.hostReady?'✅準備完了':''}\nゲスト：${current.guest?'参加済み':'待機中'} ${current.guestReady?'✅準備完了':''}\n\n${current.hostReady&&current.guestReady?'両者準備完了！ ※オンラインカード対戦は次の開発段階で実装します。':'2人そろったら準備完了を押してください。'}`;$('ready').textContent=current[side+'Ready']?'準備を解除':'準備完了';},report)}
$('create').onclick=async()=>{try{if(room)return alert('先に退出してください');for(let i=0;i<8;i++){let code=String(Math.floor(100000+Math.random()*900000));let ref=doc(db,'rooms',code);try{await runTransaction(db,async tx=>{const snap=await tx.get(ref);if(snap.exists())throw Error('CODE_TAKEN');tx.set(ref,{host:uid,guest:null,hostReady:false,guestReady:false,createdAt:serverTimestamp()})});watch(code);return}catch(e){if(e.message!=='CODE_TAKEN')throw e}}throw Error('コードの生成に失敗しました')}catch(e){report(e)}};
$('join').onclick=async()=>{try{if(room)return alert('先に退出してください');let code=$('code').value.trim();if(!/^\d{6}$/.test(code))return alert('6桁の数字を入力してください');let ref=doc(db,'rooms',code);await runTransaction(db,async tx=>{let snap=await tx.get(ref);if(!snap.exists())throw Error('部屋が見つかりません');let r=snap.data();if(r.host!==uid&&r.guest&&r.guest!==uid)throw Error('満室です');if(r.host!==uid&&r.guest!==uid)tx.update(ref,{guest:uid,guestReady:false})});watch(code)}catch(e){report(e)}};
$('ready').onclick=async()=>{try{if(!room||!side)return;await updateDoc(doc(db,'rooms',room),{[side+'Ready']:!current[side+'Ready']})}catch(e){report(e)}};
$('leave').onclick=async()=>{try{if(!room)return;let ref=doc(db,'rooms',room);await updateDoc(ref,side==='host'?{hostReady:false}:{guest:null,guestReady:false});unsub?.();unsub=null;room=null;side=null;current=null;$('roomTitle').textContent='未参加';$('log').textContent='退出しました';$('ready').disabled=true;$('leave').disabled=true}catch(e){report(e)}};
</script></body></html>
