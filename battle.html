<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オンライン基本対戦・修正版</title>
<style>body{background:#111a2d;color:white;font:16px system-ui;margin:0;padding:18px}main{max-width:760px;margin:auto}section{background:#23334d;border-radius:14px;padding:16px;margin:14px 0}button,input{font:inherit;border:0;border-radius:8px;padding:10px;margin:4px}button{background:#f1c668;color:#182039;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}input{width:130px}#hand button{display:inline-block;background:#dce6ff}.small{font-size:13px;color:#cbd5e1}#log{white-space:pre-wrap}a{color:#f1c668}#status{white-space:pre-wrap;margin-top:8px}</style></head>
<body><main><h1>⚔ オンライン基本対戦（修正版）</h1><p class="small">基本ターンの同期テストです。32種類のカード効果・不正操作防止は未実装です。信頼できる相手とのテストにのみ利用してください。</p>
<section><div id="auth">接続中…</div><input id="code" placeholder="6桁の部屋番号" maxlength="6" inputmode="numeric"><button id="enter" disabled>部屋に入る</button><div id="status"></div></section>
<section><h2 id="turn">対戦待機</h2><div id="stats"></div><button id="start" disabled>基本対戦を開始</button><button id="draw" disabled>1枚引く</button><button id="discard" disabled>選択した2枚で1ダメージ</button><button id="pass" disabled>パス</button></section>
<section><h3>自分の手札（カード効果は未実装）</h3><div id="hand"></div><p class="small">カードをクリックして選択。1枚選んで「カードを出す」か、2枚選んで「1ダメージ」を押してください。</p><button id="play" disabled>カードを出す（効果なし）</button></section>
<section><h3>対戦ログ</h3><div id="log">未接続</div></section><p><a href="online.html">← ロビーへ戻る</a></p></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInAnonymously} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,runTransaction} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyCRdX-k7sbaBE1k8MRezsf3htk1BOrURDg',authDomain:'original-card-game.firebaseapp.com',projectId:'original-card-game',storageBucket:'original-card-game.firebasestorage.app',messagingSenderId:'374012324530',appId:'1:374012324530:web:b30cb0cc4f4406dc7ef7ab'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let uid=null,code=null,room=null,game=null,mine=null,side=null,selected=[],unsubs=[],busy=false,initializing=false;
const cards=['ﾌﾞﾝﾁｮｳｱﾀｯｸ','観測者の悪ノリ','小森アタック','星色の推し活','もち蔵アタック','まずはありがとう','ガチナイス'];
const report=e=>{console.error(e);$('status').textContent='エラー：'+(e?.message||String(e))};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deck(){return shuffle(Array.from({length:20},(_,i)=>cards[i%cards.length]))}
const refRoom=()=>doc(db,'rooms',code),refGame=()=>doc(db,'testBattles',code),refMine=()=>doc(db,'testBattles',code,'players',uid);
function render(){
 const isHost=!!room&&room.host===uid,ready=!!room&&!!room.guest&&room.hostReady&&room.guestReady;
 $('start').disabled=busy||!isHost||!ready||!!game;
 if(!code){$('turn').textContent='対戦待機';return}
 if(!game){$('turn').textContent='対戦待機';$('stats').textContent=ready?'両者準備完了。ホストが対戦を開始できます。':'ロビーで両者が準備完了になるのを待っています。';$('draw').disabled=$('play').disabled=$('discard').disabled=$('pass').disabled=true;$('hand').replaceChildren();$('log').textContent='対戦開始待ち';return}
 if(game.state==='setup'){$('turn').textContent='カードを配布中…';$('stats').textContent='両プレイヤーの準備を待っています。';$('draw').disabled=$('play').disabled=$('discard').disabled=$('pass').disabled=true;$('log').textContent=(game.log||[]).slice(-10).join('\n');return}
 if(!mine){$('turn').textContent='手札を読み込み中…';return}
 const opponent=side==='host'?'guest':'host',myTurn=game.turn===uid&&game.state==='playing',needDraw=myTurn&&!game.drawn;
 $('turn').textContent=game.state==='finished'?(game.winner===uid?'🏆 勝利！':'敗北'):myTurn?'あなたのターン':'相手のターン';
 $('stats').textContent=`自分のライフ ${game[side+'Life']} ／ 相手のライフ ${game[opponent+'Life']}　|　山札 ${mine.deck.length}　|　手札 ${mine.hand.length}　|　USED ${mine.used.length}　|　相手の手札 ${game[opponent+'HandCount']}`;
 $('draw').disabled=busy||!needDraw;$('play').disabled=busy||!myTurn||!game.drawn||selected.length!==1;$('discard').disabled=busy||!myTurn||!game.drawn||selected.length!==2;$('pass').disabled=busy||!myTurn||!game.drawn;
 $('hand').replaceChildren();mine.hand.forEach((name,i)=>{const b=document.createElement('button');b.textContent=(selected.includes(i)?'☑ ':'□ ')+name;b.onclick=()=>{selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];render()};$('hand').append(b)});
 $('log').textContent=(game.log||[]).slice(-10).join('\n');
}
function watch(){unsubs.forEach(fn=>fn());unsubs=[];room=game=mine=null;selected=[];render();
 unsubs.push(onSnapshot(refRoom(),s=>{room=s.exists()?s.data():null;if(!room){$('status').textContent='ルームが見つかりません';return}side=room.host===uid?'host':room.guest===uid?'guest':null;$('status').textContent=`ルーム ${code} ／ ${side==='host'?'ホスト':'ゲスト'}`;render()},report));
 unsubs.push(onSnapshot(refGame(),s=>{game=s.exists()?s.data():null;render()},report));
 unsubs.push(onSnapshot(refMine(),s=>{mine=s.exists()?s.data():null;selected=[];render()},report));
}
onAuthStateChanged(auth,u=>{if(u){uid=u.uid;$('auth').textContent='匿名ログイン済み';$('enter').disabled=false}else{$('auth').textContent='ログイン待機';$('enter').disabled=true}});
signInAnonymously(auth).catch(report);
$('enter').onclick=async()=>{try{const c=$('code').value.trim();if(!/^\d{6}$/.test(c))throw Error('6桁のルーム番号を入力してください');if(!uid)throw Error('ログイン完了までお待ちください');const r=await getDoc(doc(db,'rooms',c));if(!r.exists()||![r.data().host,r.data().guest].includes(uid))throw Error('この部屋に参加していません。先にロビーで参加してください');code=c;watch()}catch(e){report(e)}};
$('start').onclick=async()=>{if(busy)return;busy=true;render();try{const r=await getDoc(refRoom());if(!r.exists())throw Error('ルームが見つかりません');const v=r.data();if(v.host!==uid||!v.guest||!v.hostReady||!v.guestReady)throw Error('ホストとゲスト両方の準備完了が必要です');
 await runTransaction(db,async tx=>{const s=await tx.get(refGame());if(s.exists())throw Error('この部屋には既に対戦があります。新しい部屋を作成してください');tx.set(refGame(),{host:v.host,guest:v.guest,turn:Math.random()<.5?v.host:v.guest,hostLife:7,guestLife:7,hostHandCount:0,guestHandCount:0,state:'setup',drawn:false,round:1,winner:null,log:['対戦準備中']})});
}catch(e){report(e)}finally{busy=false;render()}};
async function initialize(){if(!game||!side||game.state!=='setup')return;const p=refMine(),s=await getDoc(p);if(!s.exists()){const d=deck(),h=d.splice(0,2);await setDoc(p,{owner:uid,hand:h,deck:d,used:[]});}if(game[side+'HandCount']!==2)await updateDoc(refGame(),{[side+'HandCount']:2});}
setInterval(async()=>{if(!code||!game||!side||initializing||game.state!=='setup')return;initializing=true;try{await initialize();if(side==='host'){const s=await getDoc(refGame());if(s.exists()&&s.data().state==='setup'&&s.data().hostHandCount===2&&s.data().guestHandCount===2)await updateDoc(refGame(),{state:'playing',drawn:true,log:['対戦開始！先攻の最初のターンはドローなし']})}}catch(e){report(e)}finally{initializing=false}},1400);
async function act(kind){if(busy)return;busy=true;render();try{if(!game||!mine||game.turn!==uid||game.state!=='playing')return;const opponent=side==='host'?'guest':'host',opponentUid=game[opponent],p=refMine(),g=refGame();let m=structuredClone(mine),patch={};
 if(kind==='draw'){if(game.drawn)return;if(!m.deck.length){await updateDoc(g,{state:'finished',winner:opponentUid,log:[...game.log,'山札切れで敗北']});return}m.hand.push(m.deck.pop());patch.drawn=true;patch[side+'HandCount']=m.hand.length;patch.log=[...game.log,'ドロー'];}
 else{if(!game.drawn)return;if(kind==='play'&&selected.length!==1)return;if(kind==='discard'&&selected.length!==2)return;const idx=kind==='play'||kind==='discard'?[...selected].sort((a,b)=>b-a):[];for(const i of idx)m.used.push(m.hand.splice(i,1)[0]);if(kind==='discard')patch[opponent+'Life']=game[opponent+'Life']-1;patch[side+'HandCount']=m.hand.length;patch.log=[...game.log,kind==='play'?'カードを1枚使用（効果なし）':kind==='discard'?'2枚をUSEDにして1ダメージ':'パス'];patch.turn=opponentUid;patch.drawn=false;patch.round=game.round+1;if(kind==='discard'&&patch[opponent+'Life']<=0){patch.state='finished';patch.winner=uid}}
 // 試作版では2ドキュメント更新が原子的ではありません。正式版でサーバー処理が必要です。
 await setDoc(p,m);await updateDoc(g,patch);selected=[];
}catch(e){report(e)}finally{busy=false;render()}}
$('draw').onclick=()=>act('draw');$('play').onclick=()=>act('play');$('discard').onclick=()=>act('discard');$('pass').onclick=()=>act('pass');
</script></body></html>
